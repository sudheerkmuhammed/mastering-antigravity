# fly.toml app configuration file for Fly.io Firecracker MicroVMs
app = "antigravity-cloud-agent"
primary_region = "iad"

[build]
  dockerfile = "deploy/Dockerfile"

[env]
  PORT = "8080"
  ANTIGRAVITY_ENV = "production"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    hard_limit = 50
    soft_limit = 25

[[http_service.checks]]
  grace_period = "15s"
  interval = "30s"
  method = "GET"
  path = "/healthz"
  timeout = "5s"

[[mounts]]
  source = "antigravity_brain_vol"
  destination = "/var/data/antigravity/brain"
  initial_size = "10gb"

[[vm]]
  size = "shared-cpu-2x"
  memory = "2048mb"
  cpus = 2
