apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: antigravity-agent-service
  labels:
    cloud.google.com/location: us-central1
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/maxScale: '10'
        autoscaling.knative.dev/minScale: '1'
        run.googleapis.com/execution-environment: gen2
        run.googleapis.com/cpu-throttling: 'false'
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
      - image: gcr.io/PROJECT_ID/antigravity-agent:latest
        ports:
        - name: http1
          containerPort: 8080
        resources:
          limits:
            cpu: 2000m
            memory: 2Gi
        env:
        - name: ANTIGRAVITY_ENV
          value: "production"
        - name: GOOGLE_API_KEY
          valueFrom:
            secretKeyRef:
              name: antigravity-secrets
              key: google-api-key
        - name: TELEGRAM_BOT_TOKEN
          valueFrom:
            secretKeyRef:
              name: antigravity-secrets
              key: telegram-bot-token
        - name: WHATSAPP_API_TOKEN
          valueFrom:
            secretKeyRef:
              name: antigravity-secrets
              key: whatsapp-api-token
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 30
